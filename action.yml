name: "ArcSync"
description: "Generate architecture diagrams from your IaC build output"
author: "VanLandinghamLabs"
branding:
  icon: "share-2"
  color: "purple"
inputs:
  path:
    description: "Path to a cdk synth output directory, or a single plan file from terraform show -json or pulumi preview --save-plan"
    required: false
    default: "cdk.out"
  api-url:
    description: "ArcSync API endpoint"
    required: false
    default: "https://api.arcsync.dev"
  api-client-id:
    description: >-
      ArcSync client ID. Optional since v3: with the ArcSync App installed on
      this repository, the workflow's own GitHub OIDC token is the only
      credential needed. Supply this (with api-client-secret) only for
      repositories where the App cannot be installed, or for non-GitHub CI.
    required: false
  api-client-secret:
    description: >-
      ArcSync client secret (shown once when you create the credential).
      Optional since v3 — see api-client-id. Must be supplied together with it.
    required: false
  github-token:
    description: >-
      Token used to read this repo's metadata (visibility, description, topics)
      and to post the PR comment. Defaults to the workflow's own token, which
      needs no configuration. GITHUB_TOKEN is NOT auto-injected into an
      action's environment, so without this the backend cannot tell a private
      repo from a public one and keeps the diagram out of the gallery.
    required: false
    default: ${{ github.token }}
  comment:
    description: "Post/update a PR comment with the diagram (pull_request events only)"
    required: false
    default: "true"
  output:
    description: "Optional local file path to write the returned Mermaid markdown"
    required: false
outputs:
  mermaid:
    description: "Mermaid markdown returned by the API"
  graph-id:
    description: "ArcSync graph ID"
  graph-url:
    description: "URL to the interactive diagram on arcsync.dev"
runs:
  using: "node24"
  main: "dist/index.js"
